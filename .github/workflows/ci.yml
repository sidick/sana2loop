# CI -- run on every push to main and every PR targeting main.
#
#   amiga-build         : `make docker` -- cross-compiles loopback.device +
#                         SanaInfo with the pinned Bebbo m68k-amigaos-gcc
#                         image and uploads both as a workflow artifact.
#
#   copperline-smoke-aros : on-target smoke test (tests/copperline/) booted
#                         against Copperline's bundled, redistributable AROS
#                         Kickstart replacement -- catches gross regressions
#                         in loopback.device's echo/query path. NOT a
#                         substitute for real Kickstart 1.3: a real ROM is
#                         Cloanto/Hyperion-licensed and can't live in this
#                         public repo or its CI (see CLAUDE.md's "Why the
#                         real-1.3 ROM stays out of CI"). Run
#                         `make copperline-smoke KICK=/path/to/kick13.rom`
#                         locally before trusting a Phase 1 claim or cutting
#                         a release -- this job can't confirm 1.3-specific
#                         behavior.
#
#   semgrep             : security/quality scan with semgrep's auto rule pack.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amiga-build:
    name: Amiga cross-build (device + SanaInfo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned amiga-gcc image ref
        id: img
        run: |
          REF=$(grep '^IMAGE ' Makefile \
                  | sed -E 's/^[^=]+\?= *//; s/[[:space:]]+$//')
          KEY=$(echo "$REF" | tr ':/@' '___')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Using image ref: $REF"

      - name: Cache amiga-gcc Docker image
        id: docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/amiga-gcc.tar
          key: amiga-gcc-${{ steps.img.outputs.key }}

      - name: Load cached image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/amiga-gcc.tar

      - name: Pull + save image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "${{ steps.img.outputs.ref }}"
          docker save "${{ steps.img.outputs.ref }}" > /tmp/amiga-gcc.tar

      - name: make docker (amiga cross-build)
        run: make docker

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sana2loop-${{ github.sha }}
          path: |
            build/loopback.device
            build/SanaInfo
          retention-days: 14

  copperline-smoke-aros:
    name: Copperline smoke test (bundled AROS)
    runs-on: ubuntu-latest
    env:
      COPPERLINE_VERSION: "0.13.0"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned amiga-gcc image ref
        id: img
        run: |
          REF=$(grep '^IMAGE ' Makefile \
                  | sed -E 's/^[^=]+\?= *//; s/[[:space:]]+$//')
          KEY=$(echo "$REF" | tr ':/@' '___')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Cache amiga-gcc Docker image
        id: docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/amiga-gcc.tar
          key: amiga-gcc-${{ steps.img.outputs.key }}

      - name: Load cached image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/amiga-gcc.tar

      - name: Pull + save image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "${{ steps.img.outputs.ref }}"
          docker save "${{ steps.img.outputs.ref }}" > /tmp/amiga-gcc.tar

      - name: Cross-build device + test harness
        run: |
          make docker
          make docker-test-harness

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install xdftool (amitools)
        run: pip install --quiet amitools

      # Prebuilt AppImage, not a from-source build: no Rust toolchain/build
      # deps needed, and it bundles the redistributable AROS Kickstart
      # replacement this job boots (no ROM secret required).
      - name: Install Copperline (prebuilt AppImage, bundled AROS)
        run: |
          url="https://github.com/CopperlineHQ/Copperline/releases/download/v${COPPERLINE_VERSION}/Copperline-${COPPERLINE_VERSION}-x86_64.AppImage"
          curl -fsSL "$url" -o copperline.AppImage
          chmod +x copperline.AppImage
          ./copperline.AppImage --appimage-extract >/dev/null
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/squashfs-root/AppRun" "$HOME/.local/bin/copperline"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make copperline-smoke (bundled AROS, no KICK=)
        run: sh tests/copperline/run.sh

  semgrep:
    name: Semgrep (auto rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip wheels
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-semgrep-${{ runner.os }}-

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: semgrep --config auto
        run: |
          semgrep --config auto --error \
                  --include='*.c' --include='*.h' \
                  src/
