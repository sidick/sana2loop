# CI -- run on every push to main and every PR targeting main.
#
#   resolve-image       : reads the pinned amiga-gcc image ref out of
#                         Makefile so the two jobs below track a digest bump
#                         there automatically, with no separate job-level
#                         edit needed. Exists only because a job's own
#                         `container:` key is resolved before that job's
#                         steps run, so it can't read its own `steps.*`
#                         output -- a tiny upstream job is the way to feed it
#                         a computed value.
#
#   amiga-build         : cross-compiles loopback.device + SanaInfo, runs
#                         natively *inside* the pinned Bebbo m68k-amigaos-gcc
#                         image via the job-level `container:` key (not a
#                         manual `docker run`), and uploads both as a
#                         workflow artifact.
#
#   copperline-smoke-aros : on-target smoke test (tests/copperline/), also
#                         run inside that same container (which already
#                         bundles amitools' xdftool -- no separate install
#                         step needed), booted against Copperline's bundled,
#                         redistributable AROS Kickstart replacement --
#                         catches gross regressions in loopback.device's
#                         echo/query path. NOT a substitute for real
#                         Kickstart 1.3: a real ROM is Cloanto/Hyperion-
#                         licensed and can't live in this public repo or its
#                         CI (see CLAUDE.md's "Why the real-1.3 ROM stays out
#                         of CI"). Run `make copperline-smoke
#                         KICK=/path/to/kick13.rom` locally before trusting a
#                         Phase 1 claim or cutting a release -- this job
#                         can't confirm 1.3-specific behavior.
#
#   semgrep             : security/quality scan with semgrep's auto rule pack.
#
# Why `container:` instead of the manual docker pull/save/cache/load dance
# an earlier version of this file used (matching narrator.wyoming's
# pattern): that pattern's `docker save ... > /tmp/amiga-gcc.tar` step
# writes a SECOND near-full-size copy of the image to the runner's disk on
# top of the one `docker pull` already stored -- fine for a small image, but
# this one is ~7 GB (not the "~500 MB" narrator.wyoming's own comment
# estimated), and the doubled footprint blew through the runner's free disk
# entirely (a real failure: "no space left on device" mid-pull, see run
# https://github.com/sidick/sana2loop/actions/runs/30545394490). The
# job-level `container:` key sidesteps this altogether -- GitHub Actions
# pulls the image itself, once, with no separate save/tarball step -- and
# also removes the `docker run -v $(pwd):/work` indirection, since checkout
# already happens inside the container's filesystem. Confirmed against
# sibling project amiauth's `m68k-build` job, which uses this same pattern
# with the same pinned image.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-image:
    name: Resolve pinned amiga-gcc image ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: img
        run: |
          REF=$(grep '^IMAGE ' Makefile \
                  | sed -E 's/^[^=]+\?= *//; s/[[:space:]]+$//')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using image ref: $REF"

  amiga-build:
    name: Amiga cross-build (device + SanaInfo)
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: make amiga (cross-build)
        run: make amiga

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sana2loop-${{ github.sha }}
          path: |
            build/loopback.device
            build/SanaInfo
          retention-days: 14

  copperline-smoke-aros:
    name: Copperline smoke test (bundled AROS)
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.ref }}
    env:
      COPPERLINE_VERSION: "0.13.0"
    steps:
      - uses: actions/checkout@v7

      - name: Cross-build device + test harness
        run: |
          make amiga
          make test-harness

      # Prebuilt AppImage, not a from-source build: no Rust toolchain/build
      # deps needed, and it bundles the redistributable AROS Kickstart
      # replacement this job boots (no ROM secret required). xdftool is
      # already present in this image (amitools is preinstalled) -- no pip
      # install step needed, unlike when this ran on a plain ubuntu-latest
      # runner.
      - name: Install Copperline (prebuilt AppImage, bundled AROS)
        run: |
          url="https://github.com/CopperlineHQ/Copperline/releases/download/v${COPPERLINE_VERSION}/Copperline-${COPPERLINE_VERSION}-x86_64.AppImage"
          curl -fsSL "$url" -o copperline.AppImage
          chmod +x copperline.AppImage
          ./copperline.AppImage --appimage-extract >/dev/null
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/squashfs-root/AppRun" "$HOME/.local/bin/copperline"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make copperline-smoke (bundled AROS, no KICK=)
        run: sh tests/copperline/run.sh

  semgrep:
    name: Semgrep (auto rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip wheels
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-semgrep-${{ runner.os }}-

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: semgrep --config auto
        run: |
          semgrep --config auto --error \
                  --include='*.c' --include='*.h' \
                  src/
