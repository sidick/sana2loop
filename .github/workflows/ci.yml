# CI -- run on every push to main and every PR targeting main.
#
#   resolve-image       : reads the pinned amiga-gcc image ref out of
#                         Makefile so the build job below tracks a digest
#                         bump there automatically, with no separate job-
#                         level edit needed. Exists only because a job's own
#                         `container:` key is resolved before that job's
#                         steps run, so it can't read its own `steps.*`
#                         output -- a tiny upstream job is the way to feed it
#                         a computed value.
#
#   build               : cross-compiles loopback.device + SanaInfo + the
#                         Copperline test harness ONCE, running natively
#                         *inside* the pinned Bebbo m68k-amigaos-gcc image
#                         via the job-level `container:` key (not a manual
#                         `docker run`). Uploads the release-relevant
#                         binaries and the harness as separate artifacts.
#
#   copperline-smoke-aros : on-target smoke test (tests/copperline/) against
#                         the binaries `build` already produced -- no
#                         recompilation, and (since it never touches the
#                         cross-compiler) no need to pull that ~7 GB image a
#                         second time; a plain ubuntu-latest runner plus
#                         amitools' xdftool and a Copperline AppImage is
#                         everything this job needs. Boots Copperline's
#                         bundled, redistributable AROS Kickstart
#                         replacement -- catches gross regressions in
#                         loopback.device's echo/query path. NOT a
#                         substitute for real Kickstart 1.3: a real ROM is
#                         Cloanto/Hyperion-licensed and can't live in this
#                         public repo or its CI (see CLAUDE.md's "Why the
#                         real-1.3 ROM stays out of CI"). Run
#                         `make copperline-smoke KICK=/path/to/kick13.rom`
#                         locally before trusting a Phase 1 claim or cutting
#                         a release -- this job can't confirm 1.3-specific
#                         behavior.
#
#   semgrep             : security/quality scan with semgrep's auto rule pack.
#
# Why one build job feeding an artifact, not two independent ones each
# rebuilding from source (an earlier version of this file): the smoke test
# only needs the already-compiled device + harness bytes, not a second
# cross-compiler invocation -- rebuilding them again in their own job meant
# pulling the pinned image (~7 GB) a second time for no benefit, since a
# deterministic compiler produces the same bytes either way. Building once
# and downloading the artifact removes that entire redundant pull+compile
# from the critical path.
#
# Why `container:` (for `build`) instead of the manual docker
# pull/save/cache/load dance an even earlier version of this file used
# (matching narrator.wyoming's pattern): that pattern's
# `docker save ... > /tmp/amiga-gcc.tar` step writes a SECOND near-full-size
# copy of the image to the runner's disk on top of the one `docker pull`
# already stored -- fine for a small image, but this one is ~7 GB (not the
# "~500 MB" narrator.wyoming's own comment estimated), and the doubled
# footprint blew through the runner's free disk entirely (a real failure:
# "no space left on device" mid-pull, see run
# https://github.com/sidick/sana2loop/actions/runs/30545394490). The
# job-level `container:` key sidesteps this altogether -- GitHub Actions
# pulls the image itself, once, with no separate save/tarball step -- and
# also removes the `docker run -v $(pwd):/work` indirection, since checkout
# already happens inside the container's filesystem. Confirmed against
# sibling project amiauth's `m68k-build` job, which uses this same pattern
# with the same pinned image.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-image:
    name: Resolve pinned amiga-gcc image ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: img
        run: |
          REF=$(grep '^IMAGE ' Makefile \
                  | sed -E 's/^[^=]+\?= *//; s/[[:space:]]+$//')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using image ref: $REF"

  build:
    name: Amiga cross-build (device + SanaInfo + test harness)
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: make amiga + test-harness (cross-build)
        run: |
          make amiga
          make test-harness

      - name: Upload release-relevant binaries
        uses: actions/upload-artifact@v7
        with:
          name: sana2loop-${{ github.sha }}
          path: |
            build/loopback.device
            build/SanaInfo
          retention-days: 14

      # Separate, short-lived artifact: internal wiring for the smoke-test
      # job below, not something a user browsing workflow runs should
      # mistake for a release deliverable.
      - name: Upload Copperline test harness
        uses: actions/upload-artifact@v7
        with:
          name: sana2test-${{ github.sha }}
          path: build/sana2test
          retention-days: 1

  copperline-smoke-aros:
    name: Copperline smoke test (bundled AROS)
    needs: build
    runs-on: ubuntu-latest
    env:
      COPPERLINE_VERSION: "0.13.0"
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "{sana2loop,sana2test}-${{ github.sha }}"
          merge-multiple: true
          path: build

      # actions/upload-artifact's zip round-trip doesn't preserve the
      # executable bit -- restore it before run.sh tries to exec these.
      - name: Restore executable bits
        run: chmod +x build/loopback.device build/SanaInfo build/sana2test

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install xdftool (amitools)
        run: pip install --quiet amitools

      # Prebuilt AppImage, not a from-source build: no Rust toolchain/build
      # deps needed, and it bundles the redistributable AROS Kickstart
      # replacement this job boots (no ROM secret required).
      - name: Install Copperline (prebuilt AppImage, bundled AROS)
        run: |
          url="https://github.com/CopperlineHQ/Copperline/releases/download/v${COPPERLINE_VERSION}/Copperline-${COPPERLINE_VERSION}-x86_64.AppImage"
          curl -fsSL "$url" -o copperline.AppImage
          chmod +x copperline.AppImage
          ./copperline.AppImage --appimage-extract >/dev/null
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/squashfs-root/AppRun" "$HOME/.local/bin/copperline"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make copperline-smoke (bundled AROS, no KICK=, no rebuild)
        run: sh tests/copperline/run.sh

  semgrep:
    name: Semgrep (auto rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip wheels
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-semgrep-${{ runner.os }}-

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: semgrep --config auto
        run: |
          semgrep --config auto --error \
                  --include='*.c' --include='*.h' \
                  src/
