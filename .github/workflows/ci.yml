# CI -- run on every push to main and every PR targeting main.
#
# ci: calls sidick/amiga-workflows' build-test.yml, which implements the
# five-verb contract (see that repo's README.md, the document of record) --
# build/test-host/test-target/lint/dist all resolve to Makefile targets of
# the same name (see Makefile's own "Verb contract" comment). Each of those
# jobs is independent (no artifact-passing between them), unlike this
# repo's previous bespoke pipeline (build once, smoke-test jobs download the
# artifact) -- the m68k cross-build now runs more than once per CI run
# (build, test-target, and dist-when-enabled each call it), a deliberate
# tradeoff of standardizing on the shared workflow rather than keeping a
# repo-specific optimization. run-dist stays off (the default) since
# packaging is release.yml's job, not every-push CI's.
#
# semgrep (security/quality, auto rule pack) now runs as `make lint` inside
# build-test.yml's lint job, rather than its own job here -- see Makefile.
#
# docs-build stays a local job, not folded into build-test.yml: it's a
# rot-prevention check (strict MkDocs build + AmigaGuide conversion) that
# doesn't fit any of the five verbs cleanly, and the shared workflow has no
# hook for an extra per-project job. The real docs publish (docs.yml,
# mike-based) only runs on a release tag or manual dispatch; this job's job
# is purely to keep the site from silently rotting in between.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: sidick/amiga-workflows/.github/workflows/build-test.yml@v1
    secrets:
      AMIGA_REAL_ROM_B64: ${{ secrets.AMIGA_REAL_ROM_B64 }}

  docs-build:
    name: Docs site + AmigaGuide build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install docs toolchain
        run: pip install -r tools/docs-requirements.txt
      - name: Strict MkDocs build
        run: mkdocs build --strict
      - name: AmigaGuide conversion
        run: make guide
