name: Release

# Tag-driven releases: a release PR bumps version.mk + sana2loop.readme's
# Version: field through normal review/CI, then pushing the matching
# v<version> tag runs this. verify-version confirms the pushed tag actually
# matches those two files; release then delegates the build -> GitHub
# release -> Aminet-upload-behind-required-review pipeline to
# sidick/amiga-workflows' aminet-release.yml. The old inline $VER-embedded-
# in-binary check moved into the Makefile's own `dist` target (see its
# comment there) - aminet-release.yml's dist job runs `make dist` standalone
# with no separate build step to hang a caller-side check off of.

on:
  push:
    tags: ['v*']

jobs:
  verify-version:
    name: Verify tag matches version.mk / sana2loop.readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-version.sh "${{ github.ref_name }}"

  release:
    name: Build, release, and (on approval) publish to Aminet
    needs: verify-version
    # A reusable workflow's own `permissions:` can only narrow, never
    # widen, what the calling job already has - aminet-release.yml's
    # `gh release create` step needs contents: write, so it has to be
    # granted here too, not just relied on inside that workflow.
    permissions:
      contents: write
    uses: sidick/amiga-workflows/.github/workflows/aminet-release.yml@v1
    with:
      tag: ${{ github.ref_name }}
      project-name: sana2loop
      lha-path: build/dist/sana2loop.lha
      readme-path: build/dist/sana2loop.readme
      category: comm/net
