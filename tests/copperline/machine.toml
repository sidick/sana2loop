# Copperline machine profile for sana2loop's headless on-target smoke test.
#
# Plain 68000, 2 MB -- loopback.device's documented minimum RAM floor
# (see docs/sana2-notes.md, userdocs/Installation.md), so if this passes
# here it passes on the floor of what the device claims to support.
# Raised from the original 1 MB (512K chip + 512K slow) by the
# pre-launch-review pass: bundled AROS's own overhead (it has to load its
# own Kickstart replacement INTO whatever this profile provides, unlike a
# real ROM in true ROM space -- see docs/sana2-notes.md's M8/M9/M14/M11
# investigation sections for the full historical account of how tight
# that made 1 MB specifically) meant even small per-unit struct growth
# could tip an existing, already-passing on-target test over the edge --
# confirmed via a real regression (the "scheduled" sub-test failing on
# bundled AROS only, passing cleanly on both real Kickstart 1.3 and 3.1)
# while adding correctness-fix fields that needed no more than a few
# dozen extra bytes total. Rather than keep shaving new correctness fixes
# down to fit an increasingly tight artificial ceiling, the floor itself
# moved to 2 MB -- comfortably within what real Kickstart-1.3-class
# hardware/emulation this device already targets actually has.
#
# Boots from a minimal bootable ADF (built fresh by run.sh via xdftool: a
# blank OFS floppy with just DEVS:loopback.device, C:sana2test, and a
# one-line S:Startup-Sequence) rather than a full Workbench disk -- a real
# Workbench 1.3 image takes ~90 emulated seconds to reach a usable state
# even under warp_speed=max (disk-validator/font/icon overhead this test
# doesn't need), where the minimal disk reaches RESULT=PASS/FAIL in under
# 10. `speed = 0` (turbo floppy DMA) cuts wall-clock further on top of that.
#
# The Kickstart ROM is passed as a positional CLI arg (see run.sh), or
# omitted entirely to boot Copperline's bundled AROS replacement instead
# (what public CI uses, since a real ROM is licensed and can't live there --
# see CLAUDE.md). Prefer a real Kickstart 1.3 ROM locally: validating actual
# 1.3 fidelity is the point of this project, not just "some 68000
# Amiga-like thing", and AROS can't stand in for that.
#
# This config boots from a plain floppy image, never [[filesys]], so it
# does not hit the real 68000+[[filesys]] doorbell bug some Copperline
# versions have (see CLAUDE.md) -- any released `copperline` binary works
# fine here, confirmed against 0.13.0 with both a real 1.3 ROM and AROS.
[cpu]
model = "68000"

[memory]
# chip/slow stay at their real A500-trapdoor maximums (512K each --
# Copperline itself rejects a bigger slow value: "slow RAM ... exceeds
# A500 trapdoor/fake-fast maximum"); the extra 1M needed to reach the
# new 2 MB floor goes in as `fast` (Zorro-II-style) instead -- a
# perfectly ordinary real-world A500 configuration (trapdoor + a fast
# card), and this device has no chip-memory-specific requirement of its
# own (every allocation is plain MEMF_CLEAR, which prefers fast RAM
# automatically when any is fitted -- see docs/sana2-notes.md's "Memory
# lifetime" section).
chip = "512K"
slow = "512K"
fast = "1M"

[floppy]
drives = 1
speed = 0        # turbo: instant floppy DMA, no realistic seek/rotation delay

[floppy.df0]
path = "minimal-boot.adf"   # built fresh by run.sh via xdftool
# write_protected defaults to true (safe by default); M9's record-flush
# test needs the guest to actually create/write a file back onto this
# image, so this is disabled here -- safe since run.sh rebuilds the image
# fresh (rm -f + reformat) on every invocation anyway, nothing to protect.
write_protected = false

[emulation]
power_on = true
warp_speed = "max"
